version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    # Port 8080 is NOT exposed to the host — only reachable internally by nginx
    environment:
      - NODE_ENV=production
      - WS_PORT=8080
      - REGION=${REGION:-local}
      - SERVER_NAME=${SERVER_NAME:-Local Server}
      - ALLOWED_ORIGINS=https://${DOMAIN}
      - MAX_CONCURRENT_SESSIONS=${MAX_CONCURRENT_SESSIONS:-10}
      - MIN_WORD_LENGTH=${MIN_WORD_LENGTH:-4}
      - MAX_WORD_LENGTH=${MAX_WORD_LENGTH:-20}
      - WORDS_PER_DIFFICULTY=${WORDS_PER_DIFFICULTY:-2}
      - POINTS_PER_CORRECT=${POINTS_PER_CORRECT:-100}
      - HINT_COST_POINTS=${HINT_COST_POINTS:-30}
      - TURNS_PER_PLAYER=${TURNS_PER_PLAYER:-3}
      - SESSION_DURATION_SEC=${SESSION_DURATION_SEC:-45}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection({port:8080}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        # WebSocket goes through nginx /ws proxy on the same origin — no port 8080 needed
        VITE_WS_URL: "wss://${DOMAIN}/ws"
    # Port is NOT exposed to the host — Caddy routes to it internally
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists TLS certificates across restarts
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - client
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
