name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only allow one deploy at a time; cancel any in-progress run if a new push lands
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ─── Run CI first ───────────────────────────────────────────────────────
  ci:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # ─── Deploy game servers to Fly.io (multi-region) ──────────────────────
  deploy-servers:
    name: Deploy Server — ${{ matrix.server.name }}
    runs-on: ubuntu-latest
    needs: ci
    if: vars.DEPLOY_TARGET == 'fly' || vars.DEPLOY_TARGET == ''
    strategy:
      matrix:
        server:
          - { app: signal-decay-us,   name: US East,      region: us-east,   fly_region: iad }
          - { app: signal-decay-eu,   name: Europe,       region: eu-west,   fly_region: lhr }
          - { app: signal-decay-asia, name: Asia Pacific,  region: asia-east, fly_region: nrt }
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Configure fly.toml for ${{ matrix.server.fly_region }}
        run: |
          sed -i 's/^app = .*/app = "${{ matrix.server.app }}"/' fly.toml
          sed -i 's/^primary_region = .*/primary_region = "${{ matrix.server.fly_region }}"/' fly.toml

      - name: Deploy to Fly.io (${{ matrix.server.fly_region }})
        run: |
          flyctl deploy \
            --dockerfile Dockerfile \
            --env REGION=${{ matrix.server.region }} \
            --env SERVER_NAME="${{ matrix.server.name }}" \
            --env ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS || '*' }}" \
            --strategy immediate

  # ─── Deploy static client to GitHub Pages ──────────────────────────────
  deploy-client:
    name: Deploy Client (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [ci, deploy-servers]
    if: vars.DEPLOY_TARGET == 'fly' || vars.DEPLOY_TARGET == ''
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client (multi-server mode)
        run: npm run client:build
        env:
          VITE_SERVERS: >-
            [
              {"id":"us-east","name":"US East","region":"Virginia","url":"wss://signal-decay-us.fly.dev","flag":"🇺🇸"},
              {"id":"eu-west","name":"Europe","region":"London","url":"wss://signal-decay-eu.fly.dev","flag":"🇬🇧"},
              {"id":"asia-east","name":"Asia Pacific","region":"Tokyo","url":"wss://signal-decay-asia.fly.dev","flag":"🇯🇵"}
            ]

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Legacy: Deploy to single VM (Docker Compose) ─────────────────────
  deploy-vm:
    name: Deploy to VM (Docker Compose)
    runs-on: ubuntu-latest
    needs: ci
    if: vars.DEPLOY_TARGET == 'vm'

    steps:
      - name: SSH & redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose --env-file .env.prod.local up --build -d --remove-orphans
            docker image prune -f
