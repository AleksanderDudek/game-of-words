name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only allow one deploy at a time; cancel any in-progress run if a new push lands
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # ─── Run CI first ───────────────────────────────────────────────────────
  ci:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # ─── Deploy game server to Render (auto-deploys via repo webhook) ────
  # Render automatically deploys on push to main via its GitHub integration.
  # No CI step needed — this comment is for documentation.

  # ─── Deploy static client to GitHub Pages ──────────────────────────────
  deploy-client:
    name: Deploy Client (GitHub Pages)
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client (single-server mode)
        run: npm run client:build
        env:
          VITE_WS_URL: ${{ vars.RENDER_WS_URL || 'wss://signal-decay.onrender.com' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── Legacy: Deploy to single VM (Docker Compose) ─────────────────────
  deploy-vm:
    name: Deploy to VM (Docker Compose)
    runs-on: ubuntu-latest
    needs: ci
    if: vars.DEPLOY_TARGET == 'vm'

    steps:
      - name: SSH & redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose --env-file .env.prod.local up --build -d --remove-orphans
            docker image prune -f
